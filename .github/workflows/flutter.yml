name: Flutter CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "lab/5-*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.0'

jobs:
  checks:
    name: Analyze and test (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [Lab1/hello_pam, Lab2/run_baza]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - name: Format integration scenarios
        if: matrix.project == 'Lab2/run_baza'
        run: dart format --output=none --set-exit-if-changed integration_test test_driver
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - name: Dart exercises
        if: matrix.project == 'Lab1/hello_pam'
        run: |
          dart format --output=none --set-exit-if-changed ../dart_exercises
          dart analyze ../dart_exercises
          dart run ../dart_exercises/check.dart

  ios:
    name: iOS simulator build (${{ matrix.project }})
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [Lab1/hello_pam, Lab2/run_baza]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build ios --simulator --debug --no-codesign

  backend:
    name: TypeScript API contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Lab2/server
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test

  ci:
    name: CI passed
    if: always()
    needs: [checks, ios, backend]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all checks
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          IOS_RESULT: ${{ needs.ios.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
        run: |
          test "$CHECKS_RESULT" = success
          test "$IOS_RESULT" = success
          test "$BACKEND_RESULT" = success
